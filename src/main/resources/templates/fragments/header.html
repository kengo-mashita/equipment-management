<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <header th:fragment="header"
            style="display:flex; justify-content:space-between; align-items:center; padding:8px 16px; background:#333; color:#fff; font-family:sans-serif;">
        <span>備品・機材管理</span>
        <span>
            <span sec:authentication="name">ユーザー名</span> さん
            <form th:action="@{/logout}" method="post" style="display:inline; margin-left:8px;">
                <button type="submit">ログアウト</button>
            </form>
        </span>
    </header>
</body>
</html>
