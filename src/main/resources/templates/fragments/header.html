<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <!-- active: 現在の画面に対応するナビ項目のキー（equipment / lendings / employees） -->
    <header th:fragment="header(active)" class="app-header">
        <div class="app-header__inner">
            <a class="brand" th:href="@{/equipment}">
                <span class="brand__mark"></span>
                <span>備品・機材管理</span>
            </a>
            <nav class="app-nav">
                <a th:href="@{/equipment}" th:classappend="${active == 'equipment'} ? 'is-active'">備品一覧</a>
                <a th:href="@{/lendings}" th:classappend="${active == 'lendings'} ? 'is-active'">貸出履歴</a>
                <a th:href="@{/employees}" th:classappend="${active == 'employees'} ? 'is-active'">社員一覧</a>
            </nav>
            <div class="user-menu">
                <span class="user-chip">
                    <span class="user-avatar"
                          th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">A</span>
                    <strong sec:authentication="name">ユーザー名</strong>
                    <span sec:authorize="hasRole('ADMIN')" class="badge badge--info">管理者</span>
                    <span sec:authorize="!hasRole('ADMIN')" class="badge badge--neutral">一般</span>
                </span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn--ghost btn--sm">ログアウト</button>
                </form>
            </div>
        </div>
    </header>
</body>
</html>
