<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン - 備品・機材管理</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="brand">
            <span class="brand__mark"></span>
            <span>備品・機材管理</span>
        </div>
        <p class="login-card__lead">アカウントでログインしてください</p>

        <p class="alert alert--error" th:if="${param.error}">
            ユーザー名またはパスワードが正しくありません。
        </p>
        <p class="alert alert--info" th:if="${param.logout}">
            ログアウトしました。
        </p>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="username">ユーザー名</label>
                <input class="form-control" type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">パスワード</label>
                <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn--primary btn--block">ログイン</button>
        </form>

        <p class="login-card__footer">社内備品・機材の貸出管理システム</p>
    </div>
</body>
</html>
