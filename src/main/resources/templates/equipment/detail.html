<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>備品詳細 - 備品・機材管理</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header('equipment')}"></header>

    <main class="container container--narrow">
        <div class="page-header">
            <div>
                <h1 class="page-title" th:text="${equipment.name}">備品名</h1>
                <p class="page-subtitle">管理番号：<span th:text="${equipment.assetNumber}"></span></p>
            </div>
            <div class="page-actions">
                <a class="btn btn--secondary" th:href="@{/equipment}">一覧に戻る</a>
                <a sec:authorize="hasRole('ADMIN')" class="btn btn--primary"
                   th:href="@{/equipment/{id}/edit(id=${equipment.id})}">編集</a>
            </div>
        </div>

        <section class="card">
            <div class="card__header">
                <h2 class="card__title">備品情報</h2>
                <span class="badge"
                      th:classappend="'badge--' + ${#strings.toLowerCase(equipment.status.name())}"
                      th:text="${equipment.status.label}"></span>
            </div>
            <table class="detail-table">
                <tr>
                    <th>品名</th>
                    <td th:text="${equipment.name}"></td>
                </tr>
                <tr>
                    <th>管理番号</th>
                    <td class="cell-mono" th:text="${equipment.assetNumber}"></td>
                </tr>
                <tr>
                    <th>保管場所</th>
                    <td th:text="${equipment.location != null ? equipment.location : '-'}"></td>
                </tr>
                <tr>
                    <th>状態</th>
                    <td>
                        <span class="badge"
                              th:classappend="'badge--' + ${#strings.toLowerCase(equipment.status.name())}"
                              th:text="${equipment.status.label}"></span>
                    </td>
                </tr>
                <tr th:if="${activeLending != null}">
                    <th>借用者</th>
                    <td>
                        <strong th:text="${activeLending.employee.name}"></strong>
                        <span class="cell-muted" th:if="${activeLending.dueDate != null}"
                              th:text="'（返却予定日：' + ${activeLending.dueDate} + '）'"></span>
                    </td>
                </tr>
                <tr>
                    <th>購入日</th>
                    <td th:text="${equipment.purchaseDate != null ? equipment.purchaseDate : '-'}"></td>
                </tr>
                <tr>
                    <th>登録日時</th>
                    <td th:text="${#temporals.format(equipment.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                </tr>
                <tr>
                    <th>更新日時</th>
                    <td th:text="${#temporals.format(equipment.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
                </tr>
            </table>
        </section>
    </main>
</body>
</html>
