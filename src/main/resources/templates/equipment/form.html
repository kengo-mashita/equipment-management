<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${equipmentForm.id == null} ? '備品登録 - 備品・機材管理' : '備品編集 - 備品・機材管理'">備品フォーム</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header('equipment')}"></header>

    <main class="container container--narrow">
        <div class="page-header">
            <div>
                <h1 class="page-title" th:text="${equipmentForm.id == null} ? '備品登録' : '備品編集'">備品フォーム</h1>
                <p class="page-subtitle" th:text="${equipmentForm.id == null} ? '新しい備品を登録します' : '備品情報を編集します'"></p>
            </div>
        </div>

        <section class="card">
            <div class="card__body">
                <form th:action="${equipmentForm.id == null} ? @{/equipment} : @{/equipment/{id}/edit(id=${equipmentForm.id})}"
                      th:object="${equipmentForm}" method="post">

                    <div class="form-group">
                        <label class="form-label" for="name">品名<span class="required">必須</span></label>
                        <input class="form-control" type="text" id="name" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" placeholder="例：ノートPC">
                        <p class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="assetNumber">管理番号<span class="required">必須</span></label>
                        <input class="form-control" type="text" id="assetNumber" th:field="*{assetNumber}"
                               th:classappend="${#fields.hasErrors('assetNumber')} ? 'is-invalid'" placeholder="例：EQ-0001">
                        <p class="form-error" th:if="${#fields.hasErrors('assetNumber')}" th:errors="*{assetNumber}"></p>
                        <p class="form-hint" th:unless="${#fields.hasErrors('assetNumber')}">他の備品と重複しない番号を入力してください</p>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="location">保管場所</label>
                        <input class="form-control" type="text" id="location" th:field="*{location}" placeholder="例：本社3F倉庫">
                    </div>

                    <div class="form-group" th:if="${currentStatus == null || currentStatus.name() != 'LENT'}">
                        <label class="form-label" for="status">状態</label>
                        <select class="form-control" id="status" th:field="*{status}">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option>
                        </select>
                    </div>
                    <div class="form-group" th:if="${currentStatus != null && currentStatus.name() == 'LENT'}">
                        <label class="form-label">状態</label>
                        <p class="form-static">
                            <span class="badge badge--lent">貸出中</span>
                            返却操作でのみ解除されます
                        </p>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="purchaseDate">購入日</label>
                        <input class="form-control" type="date" id="purchaseDate" th:field="*{purchaseDate}">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn--primary">保存</button>
                        <a class="btn btn--secondary" th:href="@{/equipment}">キャンセル</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
