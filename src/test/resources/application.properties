spring.application.name=equipment-management

# テストは開発用DBファイルを汚さないよう、インメモリH2を使用する
spring.datasource.url=jdbc:h2:mem:equipment-management-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
